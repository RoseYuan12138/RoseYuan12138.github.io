<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4524a"/>
      <stop offset="100%" stop-color="#5b3a8a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#g1)"/>
  <!-- grid of detection results: 4×3 face tiles, some "fake" highlighted -->
  <g>
    <!-- row 1 -->
    <rect x="60"  y="90"  width="100" height="70" rx="6" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <rect x="180" y="90"  width="100" height="70" rx="6" fill="rgba(255,255,255,0.18)" stroke="#ff5544" stroke-width="2.5"/>
    <rect x="300" y="90"  width="100" height="70" rx="6" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <rect x="420" y="90"  width="100" height="70" rx="6" fill="rgba(255,255,255,0.18)" stroke="#ff5544" stroke-width="2.5"/>
    <!-- row 2 -->
    <rect x="60"  y="180" width="100" height="70" rx="6" fill="rgba(255,255,255,0.22)" stroke="#ff5544" stroke-width="2.5"/>
    <rect x="180" y="180" width="100" height="70" rx="6" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <rect x="300" y="180" width="100" height="70" rx="6" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <rect x="420" y="180" width="100" height="70" rx="6" fill="rgba(255,255,255,0.22)" stroke="#ff5544" stroke-width="2.5"/>
    <!-- row 3 -->
    <rect x="60"  y="270" width="100" height="70" rx="6" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <rect x="180" y="270" width="100" height="70" rx="6" fill="rgba(255,255,255,0.18)" stroke="#ff5544" stroke-width="2.5"/>
    <rect x="300" y="270" width="100" height="70" rx="6" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <rect x="420" y="270" width="100" height="70" rx="6" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <!-- silhouette heads inside each cell (simplified) -->
    <g fill="rgba(255,255,255,0.4)">
      <circle cx="110" cy="120" r="11"/><rect x="92" y="135" width="36" height="22" rx="11"/>
      <circle cx="230" cy="120" r="11"/><rect x="212" y="135" width="36" height="22" rx="11"/>
      <circle cx="350" cy="120" r="11"/><rect x="332" y="135" width="36" height="22" rx="11"/>
      <circle cx="470" cy="120" r="11"/><rect x="452" y="135" width="36" height="22" rx="11"/>
      <circle cx="110" cy="210" r="11"/><rect x="92" y="225" width="36" height="22" rx="11"/>
      <circle cx="230" cy="210" r="11"/><rect x="212" y="225" width="36" height="22" rx="11"/>
      <circle cx="350" cy="210" r="11"/><rect x="332" y="225" width="36" height="22" rx="11"/>
      <circle cx="470" cy="210" r="11"/><rect x="452" y="225" width="36" height="22" rx="11"/>
      <circle cx="110" cy="300" r="11"/><rect x="92" y="315" width="36" height="22" rx="11"/>
      <circle cx="230" cy="300" r="11"/><rect x="212" y="315" width="36" height="22" rx="11"/>
      <circle cx="350" cy="300" r="11"/><rect x="332" y="315" width="36" height="22" rx="11"/>
      <circle cx="470" cy="300" r="11"/><rect x="452" y="315" width="36" height="22" rx="11"/>
    </g>
  </g>
  <text x="300" y="50" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.92)" letter-spacing="3" text-anchor="middle">DEEPFAKEBENCH  ·  NEURIPS 2023</text>
  <text x="300" y="380" font-family="DejaVu Sans, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" letter-spacing="2" text-anchor="middle">RED = DETECTED AS FAKE</text>
</svg>
